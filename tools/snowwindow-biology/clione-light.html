<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裸海蝶 · 光向檢查</title><style>
body{margin:0;background:#07090b;color:#c9d1d6;font:13px system-ui}canvas{display:block}#note{position:fixed;left:12px;bottom:10px;opacity:.7}
</style><div id="note"></div><script type="module">
// Inspection-only lighting (dark field + one light). It is not the snowwindow room light.
// ?view=front|side|back  &gray=1 (flat grey silhouette)  &t=seconds  &light=day|moon (key intensity)
import * as THREE from 'three';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';
import {createClione} from '/src/shared/biology/clione/index.ts';
import {CLIONE_PRESETS} from '/src/places/snowwindow/CreatureMotion.ts';
RectAreaLightUniformsLib.init();
const q=new URLSearchParams(location.search),view=q.get('view')??'front',grayOn=q.get('gray')==='1',moon=q.get('light')==='moon';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;
document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#07090b');
const camera=new THREE.PerspectiveCamera(30,1,.001,10);
const k=moon?.12:1;
scene.add(new THREE.HemisphereLight('#c1ccd2','#171b20',.06*k));
const p=CLIONE_PRESETS[0],clione=createClione(p),holder=new THREE.Group();holder.add(clione.group);scene.add(holder);
holder.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),new THREE.Vector3(0,1,0));
// front/side: grazing key from the upper left; back: a window-like rect light behind the animal (camera looks into it).
if(view==='back'){const rect=new THREE.RectAreaLight('#d5dfe1',1.4*k,.6,.4);rect.position.set(0,0,-.25);rect.lookAt(0,0,0);scene.add(rect);}
else{const key=new THREE.DirectionalLight('#eef2f4',1.5*k);key.position.set(-2,1.2,.4);scene.add(key);}
const gray=new THREE.MeshStandardMaterial({color:'#a2a2a2',roughness:.9});if(grayOn)scene.overrideMaterial=gray;
const cams={front:[0,.004,.13],side:[.13,.004,.0],back:[0,.004,.13]};
function render(t){
 clione.update(t,{gait:'slowhover'});
 const c=cams[view]??cams.front;camera.position.set(...c);camera.lookAt(0,.002,0);
 renderer.render(scene,camera);
 document.getElementById('note').textContent=`${view} t=${t.toFixed(2)}s ${grayOn?'gray':''} ${moon?'moon-level key':''} · 檢查用光，非雪景光`;
}
const resize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();};
addEventListener('resize',()=>{resize();render(Number(q.get('t')??.3));});resize();
window.__render=render;render(Number(q.get('t')??.3));
</script></html>
