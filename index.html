<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#080e11"><meta name="description" content="一個空無一物的房間，只留下水、光、魚，以及時間流過的痕跡。"><title>Stillwater — 水光之間</title></head><body><main id="space" aria-label="水光之間：即時生成的靜謐空間"></main><div class="grain" aria-hidden="true"></div><header class="chrome"><a class="wordmark" href="./">STILLWATER<span>水光之間</span></a><div class="caption">A ROOM FOR NOTHING<br>水、光，以及時間。</div></header><footer class="chrome"><div class="moment"><span class="dot"></span><span id="moment-label">午後的光</span><span id="time-label">14:00</span></div><button id="settings-toggle" aria-label="開啟空間設定" aria-expanded="false" aria-controls="settings">調整空間 <span>＋</span></button></footer><section id="settings" aria-label="空間設定" hidden><div class="panel-head"><span>讓時間慢下來</span><button id="close-settings" aria-label="關閉設定">×</button></div><label for="hour">時刻 <output id="hour-value">14:00</output></label><input id="hour" type="range" min="0" max="23.99" step="0.05" value="14"><div class="presets"><button data-hour="6.5">晨曦</button><button data-hour="12">日光</button><button data-hour="17.5">暮色</button><button data-hour="23">月夜</button></div><label for="beam-strength">光束強度 <output id="beam-value">100%</output></label><input id="beam-strength" type="range" min="0" max="250" step="5" value="100" aria-label="光束強度"><label class="check"><input id="live" type="checkbox">跟隨本地時間</label><div class="actions"><button id="pause" aria-pressed="false">暫停流動</button><button id="audio" aria-pressed="false">開啟環境聲</button><button id="reset-view">重設視角</button><button id="fullscreen">全螢幕</button></div><p>拖曳畫面，環繞天窗。左右各 45°。</p></section><p id="status" role="status">光正在進來。</p><script type="module" src="/src/main.ts"></script></body></html>
