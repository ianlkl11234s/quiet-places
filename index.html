<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#080e11"><meta name="description" content="水光、樹影與海，一系列可以停留的靜謐空間。"><title>Quiet Places — 靜隅</title></head><body><main id="space" aria-label="水光之間：即時生成的靜謐空間"></main><div class="grain" aria-hidden="true"></div><header class="chrome"><a class="wordmark" href="./">QUIET PLACES<span id="place-title">水光之間</span></a><div class="caption">A ROOM FOR NOTHING<br>水、光，以及時間。</div></header><footer class="chrome"><div class="moment"><span class="dot"></span><span id="moment-label">午後的光</span><span id="time-label">14:00</span></div><button id="settings-toggle" aria-label="開啟空間設定" aria-expanded="false" aria-controls="settings">調整空間 <span>＋</span></button></footer><section id="settings" aria-label="空間設定" hidden><div class="panel-head"><span>讓時間慢下來</span><button id="close-settings" aria-label="關閉設定">×</button></div><label for="place-select">換個地方</label><select id="place-select"><option value="waterlight">水光之間 · 水與天光</option><option value="leaflight">樹影午後 · 微風與枝葉</option><option value="oceanlight">海光之室 · 緩緩潮聲</option></select><label for="hour">時刻 <output id="hour-value">14:00</output></label><input id="hour" type="range" min="0" max="23.99" step="0.05" value="14"><div class="presets"><button data-hour="12">正午</button><button data-hour="17.5">黃昏</button><button data-hour="19">暮光</button><button data-hour="23">月光</button></div><label class="check"><input id="live" type="checkbox">跟隨本地時間</label><div class="actions"><button id="pause" aria-pressed="false">暫停流動</button><button id="reset-view">重設視角</button></div><details class="settings-more"><summary>光線與更多設定</summary><div class="settings-more__body"><div id="water-options"><label for="weather">天候</label><select id="weather"><option value="clear">水光之間 · 晴日</option><option value="rain">雨落水面 · 雨日</option></select><div id="rain-controls" hidden><label for="rain-intensity">雨勢 <output id="rain-value">50%</output></label><input id="rain-intensity" type="range" min="0" max="100" step="5" value="50" aria-label="雨勢"></div></div><label for="quality">畫質</label><select id="quality"><option value="standard">標準 · 30 fps</option><option value="low">節能 · 24 fps</option></select><label for="beam-strength">光束強度 <output id="beam-value">100%</output></label><input id="beam-strength" type="range" min="0" max="250" step="5" value="100" aria-label="光束強度"><div class="actions"><button id="audio" aria-pressed="false">開啟環境聲</button><button id="water-reset">重設水面</button><button id="fullscreen">全螢幕</button></div><div id="music"></div><button id="export-series">輸出樹影與海光 · 八張圖片</button><p id="export-message" role="status"></p><p id="water-mode" role="status"></p><p id="water-hint">輕點天窗產生漣漪。拖曳畫面，環繞天窗。左右各 45°。</p></div></details></section><section id="series-gallery" role="dialog" aria-modal="true" aria-label="八種安靜的時刻" hidden><div class="series-head"><h2>八種安靜的時刻</h2><a id="download-series">下載全部 ZIP</a><button id="close-gallery">回到空間</button></div><div id="series-images"></div></section><p id="status" role="status">光正在進來。</p><script type="module" src="/src/main.ts"></script></body></html>
